name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build helper
        run: cargo build --release
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/spotisaver
